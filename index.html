<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVAT Track Merger</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        #drop-zone {
            width: 400px;
            height: 250px;
            border: 3px dashed #a0aabf;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #drop-zone.dragover {
            border-color: #4a90e2;
            background-color: #ebf4ff;
            transform: scale(1.02);
        }
        .message {
            text-align: center;
            pointer-events: none;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 10px;
            color: #6b7280;
        }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
        p { margin: 0; color: #6b7280; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="drop-zone">
        <div class="message">
            <div class="icon">📁</div>
            <h2>Drag & Drop CVAT XML Here</h2>
            <p>File will be merged and downloaded instantly</p>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const file = dt.files[0];

            if (file && file.name.endsWith('.xml')) {
                processFile(file);
            } else {
                alert("Please drop a valid XML file.");
            }
        }

        function processFile(file) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const xmlString = e.target.result;
                try {
                    const mergedXML = mergeCVATXML(xmlString);
                    downloadFile(mergedXML, 'merged_' + file.name);
                } catch (error) {
                    console.error("Error parsing XML:", error);
                    alert("There was an error processing the XML. Check the console.");
                }
            };

            reader.readAsText(file);
        }

        function mergeCVATXML(xmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");

            const frameData = {};
            const expectedPoints = {}; // Stores the full schema of joints for each skeleton
            const originalTracks = Array.from(xmlDoc.getElementsByTagName('track'));

            // 1. First Pass: Group elements and learn the skeleton schema
            originalTracks.forEach(track => {
                const label = track.getAttribute('label');
                if (!frameData[label]) frameData[label] = {};
                if (!expectedPoints[label]) expectedPoints[label] = new Set();

                Array.from(track.children).forEach(child => {
                    const frameStr = child.getAttribute('frame');
                    if (frameStr === null) return;

                    if (!frameData[label][frameStr]) {
                        frameData[label][frameStr] = [];
                    }
                    frameData[label][frameStr].push(child);

                    // If it's a skeleton, map out all the possible joints it possesses
                    if (child.tagName === 'skeleton') {
                        Array.from(child.getElementsByTagName('points')).forEach(pt => {
                            expectedPoints[label].add(pt.getAttribute('label'));
                        });
                    }
                });
            });

            const root = xmlDoc.getElementsByTagName('annotations')[0];

            // 2. Erase old tracks
            originalTracks.forEach(track => track.parentNode.removeChild(track));

            let trackIdCounter = 0;

            // 3. Build master tracks
            for (const label in frameData) {
                const newTrack = xmlDoc.createElement('track');
                newTrack.setAttribute('id', trackIdCounter++);
                newTrack.setAttribute('label', label);
                newTrack.setAttribute('source', 'auto');

                const frames = Object.keys(frameData[label]).map(Number).sort((a, b) => a - b);
                
                // Track last known coordinates to prevent invisible points from snapping to 0,0
                const lastKnownPos = {}; 

                frames.forEach(frameNum => {
                    const elements = frameData[label][frameNum.toString()];
                    
                    let bestElement = null;
                    let maxScore = -1;

                    // Score duplicates on this frame to find the most accurate prediction
                    elements.forEach(el => {
                        let score = 0;
                        if (el.tagName === 'skeleton') {
                            const points = Array.from(el.getElementsByTagName('points'));
                            points.forEach(pt => {
                                if (pt.getAttribute('outside') === '0') score++;
                            });
                        } else if (el.tagName === 'box') {
                            if (el.getAttribute('outside') === '0') score++;
                        }

                        if (score > maxScore) {
                            maxScore = score;
                            bestElement = el;
                        }
                    });

                    if (bestElement) {
                        bestElement.setAttribute('outside', '0'); 
                        bestElement.setAttribute('keyframe', '1'); 
                        
                        if (bestElement.tagName === 'skeleton') {
                            const existingPoints = new Map();
                            const pointsElements = Array.from(bestElement.getElementsByTagName('points'));
                            
                            // Process the points that YOLO actually predicted
                            pointsElements.forEach(pt => {
                                const ptLabel = pt.getAttribute('label');
                                existingPoints.set(ptLabel, pt);
                                
                                pt.setAttribute('keyframe', '1');

                                if (pt.getAttribute('outside') === '1') {
                                    pt.setAttribute('outside', '1');
                                    pt.setAttribute('occluded', '1');
                                } else {
                                    pt.setAttribute('outside', '0');
                                }

                                // Update last known position
                                lastKnownPos[ptLabel] = pt.getAttribute('points');
                            });

                            // Inject missing points based on the schema we learned earlier
                            if (expectedPoints[label]) {
                                expectedPoints[label].forEach(expectedLabel => {
                                    if (!existingPoints.has(expectedLabel)) {
                                        // Create the missing ghost point
                                        const newPt = xmlDoc.createElement('points');
                                        newPt.setAttribute('label', expectedLabel);
                                        newPt.setAttribute('keyframe', '1');
                                        newPt.setAttribute('outside', '1'); // Force CVAT to hide it
                                        newPt.setAttribute('occluded', '1');
                                        
                                        // Use last known position, or a safe default if it's the very first frame
                                        newPt.setAttribute('points', lastKnownPos[expectedLabel] || "0.00,0.00");
                                        
                                        bestElement.appendChild(newPt);
                                    }
                                });
                            }
                        }

                        newTrack.appendChild(bestElement);
                    }
                });

                root.appendChild(newTrack);
            }

            const serializer = new XMLSerializer();
            let finalXmlString = serializer.serializeToString(xmlDoc);

            if (!finalXmlString.startsWith('<?xml')) {
                finalXmlString = '<?xml version="1.0" encoding="utf-8"?>\n' + finalXmlString;
            }

            return finalXmlString;
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/xml' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
